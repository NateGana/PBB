<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BAHAYBUZZ — PBB Fan Community</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0D18;--bg2:#14172A;--card:#1B2038;--db:#193E78;--eb:#2878E5;--red:#D52B42;--gold:#F2C75C;--w:#F7F5FC;--mu:#A9ADC3;--pk:#EF91BD;--pu:#8E72D8;--ac:var(--eb)}
*{box-sizing:border-box;margin:0}body{font-family:Poppins,sans-serif;background:var(--bg);color:var(--w);overflow-x:hidden}
body.t-jeo{--ac:var(--eb)}body.t-gehlee{--ac:var(--pu)}body.t-jl{--ac:var(--pk)}
nav{position:fixed;top:0;left:0;right:0;height:60px;background:#0b0d18ee;backdrop-filter:blur(10px);display:flex;align-items:center;gap:10px;padding:0 14px;z-index:20;border-bottom:1px solid #fff1}
.logo{font-weight:800;letter-spacing:2px;background:linear-gradient(90deg,var(--eb),var(--red),var(--gold));-webkit-background-clip:text;color:transparent}
nav small{color:var(--mu);font-size:9px;display:block;letter-spacing:1px}nav .sp{flex:1}
aside{position:fixed;top:60px;bottom:0;left:0;width:200px;background:var(--bg2);padding:10px;overflow:auto;z-index:15;transition:.3s}
aside a{display:flex;gap:10px;padding:9px 12px;border-radius:10px;color:var(--mu);text-decoration:none;font-size:14px;margin-bottom:2px}
aside a:hover,aside a.on{background:#fff1;color:var(--w);box-shadow:inset 3px 0 var(--ac)}
body.col aside{width:56px}body.col aside span{display:none}body.col main{margin-left:56px}
main{margin:60px 0 0 200px;padding:22px;transition:.3s;animation:fi .4s}@keyframes fi{from{opacity:0;transform:translateY(8px)}}
button,.btn{background:var(--ac);color:#fff;border:0;border-radius:20px;padding:8px 16px;cursor:pointer;font:600 13px Poppins;text-decoration:none;display:inline-block}
button.g{background:#fff1;color:var(--w)}button.r{background:var(--red)}
input,textarea,select{width:100%;background:var(--bg);color:var(--w);border:1px solid #fff2;border-radius:10px;padding:9px;margin:5px 0;font:14px Poppins}
.card{background:var(--card);border-radius:16px;padding:16px;margin:10px 0;border:1px solid #fff1;transition:.25s}.card:hover{transform:translateY(-3px);box-shadow:0 8px 24px #0006,0 0 0 1px var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.hero{border-radius:22px;padding:50px 24px;background:radial-gradient(circle at 20% 20%,var(--db),transparent 60%),radial-gradient(circle at 80% 70%,#D52B4255,transparent 55%),var(--bg2);position:relative;overflow:hidden}
body.t-jl .hero{background:radial-gradient(circle at 20% 20%,#EF91BD66,transparent 60%),radial-gradient(circle at 80% 70%,#8E72D877,transparent 55%),#2a1f3d}
.hero h1{font-size:clamp(28px,6vw,54px);line-height:1.1}.jl{font-family:'Playfair Display',serif;font-style:italic;color:var(--gold);font-size:clamp(44px,10vw,90px)}
.fl{position:absolute;opacity:.3;animation:fl 6s ease-in-out infinite;font-size:30px}@keyframes fl{50%{transform:translateY(-18px)}}
.tag{background:#fff1;border-radius:10px;padding:2px 8px;font-size:11px;color:var(--gold);margin-right:4px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.row button{padding:5px 10px}
.bar{background:#fff1;border-radius:8px;height:22px;margin:4px 0;position:relative;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--eb),var(--pu));transition:width .8s}.bar b{position:absolute;left:8px;top:2px;font-size:12px}
.cm{font-size:13px;color:var(--mu);padding:3px 0}.pol{background:linear-gradient(#fff,#fff0) ,var(--card)}
body.t-jl .pol{border:6px solid #f7f5fc;border-bottom-width:16px;background:#2a1f3d;transform:rotate(-.6deg)}
.av{width:90px;height:90px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--gold));display:grid;place-items:center;font-size:36px;font-weight:800}
.warn{background:#D52B4233;border:1px solid var(--red);border-radius:12px;padding:8px 12px;font-size:12px;margin:8px 0}
#toast{position:fixed;bottom:20px;right:20px;background:var(--gold);color:#000;padding:10px 18px;border-radius:12px;display:none;z-index:50}
#mb{display:none}.mut{color:var(--mu);font-size:13px}.ld{max-width:100%;border-radius:12px;max-height:240px;object-fit:cover}
@media(max-width:760px){aside{transform:translateX(-100%)}body.open aside{transform:none;width:200px}main,body.col main{margin-left:0;padding:12px}#mb{display:inline-block}nav small{display:none}}
</style></head><body>
<nav><button class="g" id="mb" data-a="menu">☰</button><button class="g" data-a="col">⇔</button><div class="logo">BAHAYBUZZ<small>PBB FAN COMMUNITY</small></div><div class="sp"></div><input id="q" placeholder="Search..." style="width:160px;margin:0"><span id="na"></span></nav>
<aside id="sb"></aside><main id="main"></main><div id="toast"></div>
<script>
const K='bahaybuzz_v1';
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toLocaleDateString();
const bad=/(fuck|shit|bitch|http:\/\/spam)/i;
let S=JSON.parse(localStorage.getItem(K)||'null')||seed(),tab='Overview',room='General PBB Community',lastPost=0,qres=null,pend='',sq='';
function seed(){const m=(t,cat,d)=>({id:uid(),t,cat,ep:'Episode/date: to be added by admin',d,src:'Admin to add public source',likes:[],saves:[],cm:[],rx:{},demo:1,tags:['jeolee']});
return{users:[{id:'u0',name:'admin',pw:'admin123',role:'admin',bio:'Demo administrator',joined:today(),ban:0,fav:'JeoLee'}],me:null,
prof:{jeo:'Fan spotlight page for Jeo Ong. Admins can add a publicly sourced biography here.',gehlee:'Fan spotlight page for Gehlee Dangca. Admins can add a publicly sourced biography here.'},
moments:[m('Sample kilig moment','Kilig Moments','DEMO DATA placeholder. Replace with a verified, sourced moment.'),m('Sample teamwork moment','Teamwork','DEMO DATA placeholder. Replace with a verified, sourced moment.'),m('Sample funny interaction','Funny Interactions','DEMO DATA placeholder. Replace with a verified, sourced moment.')],
eps:[{id:uid(),n:1,t:'Sample episode entry',date:'TBD',rc:'DEMO DATA. Admin enters sourced recaps.',who:'jeolee',src:'',saves:[],watched:[],notes:{},demo:1}],
posts:[],polls:[{id:uid(),t:'Favorite JeoLee moment (UNOFFICIAL fan poll)',d:'Demo poll',cat:'Favorite JeoLee Moment',by:'u0',closed:0,date:today(),opts:[{id:uid(),t:'Kilig moments',v:[]},{id:uid(),t:'Funny interactions',v:[]},{id:uid(),t:'Heartfelt talks',v:[]}]}],
gal:[],msgs:{},nt:[],rep:[],qr:[],log:[],
qs:[{id:uid(),c:'Fan Community Trivia',q:'BAHAYBUZZ is...',o:['An official PBB site','An unofficial fan project','A TV network','A streaming service'],a:1,e:'BAHAYBUZZ is an independent fan-made project. (Community-made trivia)'},{id:uid(),c:'JeoLee Moments',q:'JeoLee is...',o:['A confirmed relationship','A fan-created pairing name','A show title','A contest prize'],a:1,e:'JeoLee is a fan-created pairing name, not a confirmed relationship.'}]}}
const sv=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('Storage full. Remove some images.')}};
const $=s=>document.querySelector(s),me=()=>S.users.find(u=>u.id===S.me),isA=()=>me()&&me().role==='admin';
const un=id=>(S.users.find(u=>u.id===id)||{name:'deleted'}).name;
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e.t);e.t=setTimeout(()=>e.style.display='none',2500)};
const note=(u,t)=>{if(u&&u!==S.me)S.nt.unshift({id:uid(),u,t,r:0})};
const tog=(a,x)=>{const i=a.indexOf(x);i<0?a.push(x):a.splice(i,1)};
const logA=t=>S.log.unshift(new Date().toLocaleString()+' — '+t);
function need(){if(!me()){toast('Please sign in first');location.hash='#/auth';return 0}return 1}
const NAV=[['home','🏠','Home'],['explore','🧭','Explore'],['jeo','🔷','Jeo Ong'],['gehlee','💜','Gehlee Dangca'],['jeolee','💗','JeoLee Moments'],['episodes','📺','Episodes'],['polls','📊','Fan Polls'],['gallery','🖼️','Fan Gallery'],['community','💬','Community'],['saved','🔖','Saved'],['history','🕘','History'],['quiz','❓','Trivia'],['board','🏆','Leaderboard'],['rooms','🏠','Fan Rooms'],['profile','👤','Profile'],['notifs','🔔','Notifications'],['admin','🛠️','Admin'],['about','ℹ️','About']];
const disc='<div class="warn">DEMO MODE: data is stored only in this browser (localStorage) and does not sync between devices. Unofficial fan project, not affiliated with PBB, ABS-CBN, GMA Network, or the featured personalities.</div>';
const emb='<svg width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#193E78"/><path d="M12 2a10 10 0 0 1 0 20z" fill="#D52B42"/><circle cx="12" cy="12" r="4" fill="#F2C75C"/></svg>';
function mc(m){return`<div class="card pol"><b>${esc(m.t)}</b> <span class="tag">${esc(m.cat)}</span>${m.demo?'<span class="tag">DEMO DATA</span>':''}<p>${esc(m.d)}</p><small class="mut">${esc(m.ep)} · Source: ${esc(m.src)}</small><div class="row"><button data-a="ml" data-i="${m.id}">♥ ${m.likes.length}</button><button class="g" data-a="ms" data-i="${m.id}">${m.saves.includes(S.me)?'★':'☆'} Save</button><button class="g" data-a="mcm" data-i="${m.id}">💬 ${m.cm.length}</button>${['😍','😂','🥹'].map(e=>`<button class="g" data-a="mr" data-i="${m.id}" data-e="${e}">${e}${m.rx[e]||0}</button>`).join('')}<button class="g" data-a="sh" data-i="${m.id}">Share</button></div>${m.cm.map(c=>`<div class="cm"><b>${esc(un(c.u))}</b> ${esc(c.t)}</div>`).join('')}</div>`}
function pc(p){const mine=p.u===S.me;return`<div class="card"><b>${esc(un(p.u))}</b> <span class="tag">${esc(p.tab)}</span><span class="mut">${esc(p.d)}</span><p>${esc(p.t)}</p>${p.img?`<img class="ld" src="${p.img}">`:''}<div class="row"><button data-a="pl" data-i="${p.id}">♥ ${p.likes.length}</button><button class="g" data-a="ps" data-i="${p.id}">${p.saves.includes(S.me)?'★':'☆'}</button><button class="g" data-a="pcm" data-i="${p.id}">💬 ${p.cm.length}</button><button class="g" data-a="rep" data-i="${p.id}">Report</button>${mine?`<button class="g" data-a="pe" data-i="${p.id}">Edit</button><button class="r" data-a="pd" data-i="${p.id}">Delete</button>`:''}</div>${p.cm.map(c=>`<div class="cm"><b>${esc(un(c.u))}</b> ${esc(c.t)}</div>`).join('')}</div>`}
function pollc(p){const tot=p.opts.reduce((a,o)=>a+o.v.length,0),voted=p.opts.some(o=>o.v.includes(S.me));return`<div class="card"><b>${esc(p.t)}</b> <span class="tag">${esc(p.cat)}</span><span class="tag">UNOFFICIAL FAN POLL</span><p class="mut">${esc(p.d)} · by ${esc(un(p.by))} · ${p.date} · ${tot} votes ${p.closed?'· CLOSED':''}</p>${p.opts.map(o=>{const pc=tot?Math.round(o.v.length/tot*100):0;return`<div class="bar" ${!p.closed&&!voted?`data-a="pv" data-i="${p.id}" data-o="${o.id}" style="cursor:pointer"`:''}><i style="width:${pc}%"></i><b>${esc(o.t)} · ${pc}% (${o.v.length})</b></div>`}).join('')}<p class="mut">${p.closed?'Poll closed.':voted?'You voted.':'Click an option to vote.'} Not an official PBB vote.</p>${isA()&&!p.closed?`<button class="g" data-a="pcl" data-i="${p.id}">Close poll</button>`:''}</div>`}
function epc(e){return`<div class="card"><b>Ep ${esc(e.n)}: ${esc(e.t)}</b> <span class="tag">${esc(e.date)}</span>${e.demo?'<span class="tag">DEMO DATA</span>':''}<p>${esc(e.rc)}</p>${e.src?`<a class="mut" href="${esc(e.src)}" target="_blank" rel="noopener">Source</a>`:''}<div class="row"><button class="g" data-a="es" data-i="${e.id}">${e.saves.includes(S.me)?'★ Saved':'☆ Save'}</button><button class="g" data-a="ew" data-i="${e.id}">${e.watched.includes(S.me)?'✓ Watched':'Mark watched'}</button><button class="g" data-a="en" data-i="${e.id}">📝 Private note</button></div>${e.notes[S.me]?`<div class="cm">Your note: ${esc(e.notes[S.me])}</div>`:''}</div>`}
function galc(g){return`<div class="card pol"><img class="ld" src="${g.img}"><b>${esc(g.t)}</b> <span class="tag">${esc(g.cat)}</span><p class="mut">by ${esc(un(g.u))} · ${g.date}</p><div class="row"><button data-a="gl" data-i="${g.id}">♥ ${g.likes.length}</button><button class="g" data-a="gv" data-i="${g.id}">Fullscreen</button><button class="g" data-a="grep" data-i="${g.id}">Report</button></div></div>`}
const posts=f=>S.posts.filter(f).map(pc).join('')||'<p class="mut">Nothing yet.</p>';
function profile(k,nm){const who=k;return`<div class="hero"><div class="av">${nm[0]}</div><h1>${nm}</h1><p>${esc(S.prof[k])}</p><p class="mut">Fan appreciation page. Information is admin-entered and publicly sourced only.</p></div><div class="row">${['Overview','Memorable Moments','Episode Appearances','Fan Edits','Fan Discussions'].map(t=>`<button class="${t===tab?'':'g'}" data-a="tab" data-i="${t}">${t}</button>`).join('')}</div>`+(tab==='Overview'?`<div class="card">${esc(S.prof[k])}</div>`:tab==='Memorable Moments'?S.moments.filter(m=>m.tags.includes(who)||m.tags.includes('jeolee')).map(mc).join(''):tab==='Episode Appearances'?S.eps.filter(e=>e.who.includes(who)).map(epc).join('')||'<p class="mut">No entries.</p>':tab==='Fan Edits'?S.gal.filter(g=>g.ok&&g.cat.includes('Edit')).map(galc).join('')||'<p class="mut">No approved edits yet.</p>':posts(p=>p.tab.toLowerCase()===who))}
const P={
home(){return`<div class="hero"><span class="fl" style="left:8%;top:12%">✦</span><span class="fl" style="right:10%;top:20%">♥</span><p class="mut">INSIDE THE HOUSE. BEYOND THE SCREEN.</p><h1>THE HOUSE IS FULL OF STORIES.</h1><p>Follow the journey of Jeo, Gehlee, and the moments that bring their fans together.</p><div class="row"><a class="btn" href="#/jeo">EXPLORE JEO</a><a class="btn" href="#/gehlee" style="background:var(--pu)">EXPLORE GEHLEE</a><a class="btn" href="#/jeolee" style="background:var(--pk)">ENTER JEOLEE WORLD</a></div></div>${disc}<div class="grid">${[['Registered Fans',S.users.length],['Community Posts',S.posts.length],['Fan Polls',S.polls.length],['Gallery',S.gal.length],['Saved Moments',S.moments.reduce((a,m)=>a+m.saves.length,0)]].map(s=>`<div class="card"><h2>${s[1]}</h2><span class="mut">${s[0]} (demo data)</span></div>`).join('')}</div><h3>JeoLee Moments</h3>${S.moments.slice(0,2).map(mc).join('')}<h3>Community Polls</h3>${S.polls.slice(0,1).map(pollc).join('')}<h3>Trending Discussions</h3>${posts(()=>1).slice(0,4000)}`},
explore(){return`<h2>Explore</h2><div class="grid">${NAV.slice(2,14).map(n=>`<a class="card btn" style="background:var(--card)" href="#/${n[0]}">${n[1]} ${n[2]}</a>`).join('')}</div>`},
jeo(){return profile('jeo','Jeo Ong')},gehlee(){return profile('gehlee','Gehlee Dangca')},
jeolee(){const f=tab in{'Latest':1,'Most Popular':1,'Most Saved':1,'Kilig Moments':1,'Funny Interactions':1}?tab:'Latest';let l=[...S.moments];if(f==='Most Popular')l.sort((a,b)=>b.likes.length-a.likes.length);if(f==='Most Saved')l.sort((a,b)=>b.saves.length-a.saves.length);if(/Kilig|Funny/.test(f))l=l.filter(m=>m.cat===f);
return`<div class="hero"><span class="fl" style="left:6%;top:14%">♥</span><span class="fl" style="right:8%;bottom:14%">♥</span><div class="jl">JeoLee</div><p>Two Housemates. Countless Moments. One Growing Fan Community.</p><div class="warn" style="color:#fff">JeoLee is a fan-created pairing name. Content is fan appreciation and interpretation, not confirmation of a real-life relationship.</div></div><h3>Timeline & Moment Archive</h3><div class="row">${['Latest','Most Popular','Most Saved','Kilig Moments','Funny Interactions'].map(t=>`<button class="${t===f?'':'g'}" data-a="tab" data-i="${t}">${t}</button>`).join('')}</div>${l.map(mc).join('')}<h3>Fan Wall</h3><form data-f="post"><input type="hidden" name="tab" value="JeoLee"><textarea name="t" placeholder="Share an appreciation message or favorite memory (fan-created content)" maxlength="400"></textarea><button>Post to Fan Wall</button></form>${posts(p=>p.tab==='JeoLee')}`},
episodes(){const l=S.eps.filter(e=>(e.t+e.rc+e.n).toLowerCase().includes(sq));return`<h2>Episodes</h2><input data-s="ep" placeholder="Search episodes" value="${esc(sq)}">${l.map(epc).join('')||'<p class="mut">No episodes. Admin can add sourced entries.</p>'}`},
polls(){return`<h2>Fan Polls</h2><div class="warn">All polls are unofficial community fan polls and do not influence the actual program.</div><form class="card" data-f="poll"><input name="t" placeholder="Poll title" required><input name="d" placeholder="Description"><select name="cat">${['Favorite Jeo Moment','Favorite Gehlee Moment','Favorite JeoLee Moment','Most Memorable Episode','Funniest Interaction','Favorite Fan Edit','Community Predictions','Fan Questions'].map(c=>`<option>${c}</option>`).join('')}</select><textarea name="o" placeholder="One option per line (min 2)" required></textarea><button>Create poll</button></form>${S.polls.map(pollc).join('')}`},
gallery(){return`<h2>Fan Gallery</h2><div class="warn">Only upload images you own or are authorized to share. No private or leaked photos. Submissions await admin approval. Local image storage is limited by your browser.</div><form class="card" data-f="gal"><input type="file" accept="image/*" data-up="1"><input name="t" placeholder="Title" required><select name="cat">${['Jeo Ong Photos','Gehlee Photos','JeoLee Edits','Fan Art','Wallpapers','Memorable Screenshots','Creative Posters','Fan Graphics'].map(c=>`<option>${c}</option>`).join('')}</select><button>Submit</button></form><div class="grid">${S.gal.filter(g=>g.ok).map(galc).join('')||'<p class="mut">No approved images yet.</p>'}</div>`},
community(){const f=tab in{'Jeo':1,'Gehlee':1,'JeoLee':1,'Popular':1}?tab:'For You';let l=[...S.posts];if(['Jeo','Gehlee','JeoLee'].includes(f))l=l.filter(p=>p.tab===f);if(f==='Popular')l.sort((a,b)=>b.likes.length-a.likes.length);return`<h2>Community</h2><form class="card" data-f="post"><select name="tab"><option>Jeo</option><option>Gehlee</option><option selected>JeoLee</option><option>General</option></select><textarea name="t" placeholder="Share something..." maxlength="500"></textarea><input type="file" accept="image/*" data-up="1"><button>Post</button></form><div class="row">${['For You','Jeo','Gehlee','JeoLee','Popular'].map(t=>`<button class="${t===f?'':'g'}" data-a="tab" data-i="${t}">${t}</button>`).join('')}</div>${l.map(pc).join('')||'<p class="mut">No posts yet.</p>'}`},
saved(){const u=S.me;return`<h2>Saved</h2>${S.moments.filter(m=>m.saves.includes(u)).map(mc).join('')}${S.eps.filter(e=>e.saves.includes(u)).map(epc).join('')}${S.posts.filter(p=>p.saves.includes(u)).map(pc).join('')}`},
history(){const u=S.me;return`<h2>History</h2>${S.qr.filter(r=>r.u===u).map(r=>`<div class="card">Quiz ${r.s}/${r.n} · ${r.d}</div>`).join('')||'<p class="mut">No quiz history.</p>'}${S.polls.filter(p=>p.opts.some(o=>o.v.includes(u))).map(p=>`<div class="card">Voted in: ${esc(p.t)}</div>`).join('')}`},
quiz(){return`<h2>Trivia</h2><p class="mut">Community-made trivia. Admins manage the question bank.</p>${qres?`<div class="card"><h3>Score: ${qres.s}/${qres.n}</h3>${qres.ex.map(e=>`<p>${e}</p>`).join('')}</div>`:''}<form data-f="quiz">${S.qs.map((q,i)=>`<div class="card"><b>${esc(q.q)}</b> <span class="tag">${esc(q.c)}</span>${q.o.map((o,j)=>`<label style="display:block"><input type="radio" name="q${i}" value="${j}" style="width:auto"> ${esc(o)}</label>`).join('')}</div>`).join('')}<button>Submit answers</button></form>`},
board(){const c=u=>({u,p:S.posts.filter(x=>x.u===u).length,g:S.gal.filter(x=>x.u===u&&x.ok).length,v:S.polls.filter(p=>p.opts.some(o=>o.v.includes(u))).length});const L=S.users.map(u=>c(u.id)).sort((a,b)=>(b.p+b.g+b.v)-(a.p+a.g+a.v));return`<h2>Leaderboard</h2><div class="warn">Based only on local platform activity. Not official popularity or votes.</div>${L.map((r,i)=>`<div class="card">#${i+1} ${esc(un(r.u))} · ${r.p} posts · ${r.g} gallery · ${r.v} polls</div>`).join('')}`},
rooms(){const R=['Jeo Fans','Gehlee Fans','JeoLee Shippers','PBB Episode Discussions','General PBB Community'];return`<h2>Fan Rooms</h2><div class="warn">DEMO MODE chat stored locally. Real multi-user chat needs an online backend. No streams or pirated episodes.</div><div class="row">${R.map(r=>`<button class="${r===room?'':'g'}" data-a="room" data-i="${r}">${r}</button>`).join('')}</div><div class="card">${(S.msgs[room]||[]).map(m=>`<div class="cm"><b>${esc(un(m.u))}</b> ${esc(m.t)}</div>`).join('')||'<p class="mut">No messages.</p>'}<form data-f="msg"><input name="t" placeholder="Message (demo)" required><button>Send</button></form></div>`},
profile(){const u=me();if(!u)return P.auth();const pc=S.posts.filter(p=>p.u===u.id).length,gc=S.gal.filter(g=>g.u===u.id).length,pv=S.polls.filter(p=>p.opts.some(o=>o.v.includes(u.id))).length;const b=[];if(pc)b.push('First Fan Post');if(S.posts.some(p=>p.u===u.id&&p.tab==='Jeo'))b.push('Jeo Supporter');if(S.posts.some(p=>p.u===u.id&&p.tab==='Gehlee'))b.push('Gehlee Supporter');if(S.posts.filter(p=>p.u===u.id&&p.tab==='JeoLee').length)b.push('JeoLee Enthusiast');if(pc+gc>=3)b.push('Community Contributor');if(gc)b.push('Fan Artist');if(S.qr.some(r=>r.u===u.id&&r.s===r.n))b.push('Trivia Champion');return`<div class="card"><div class="av">${esc(u.name[0].toUpperCase())}</div><h2>${esc(u.name)}</h2><p class="mut">Joined ${u.joined} · ${pc} posts · ${gc} uploads · ${pv} polls</p><form data-f="prof"><textarea name="bio" placeholder="Biography">${esc(u.bio)}</textarea><select name="fav">${['Jeo','Gehlee','JeoLee'].map(f=>`<option ${u.fav===f?'selected':''}>${f}</option>`).join('')}</select><button>Save profile</button></form><h3>Achievements</h3>${b.map(x=>`<span class="tag">🏅 ${x}</span>`).join('')||'<span class="mut">None yet</span>'}<div class="row"><button class="r" data-a="out">Log out</button></div></div>`},
notifs(){const l=S.nt.filter(n=>n.u===S.me);return`<h2>Notifications</h2><button class="g" data-a="nall">Mark all read</button>${l.map(n=>`<div class="card" style="opacity:${n.r?.5:1}">${esc(n.t)} <button class="g" data-a="nr" data-i="${n.id}">Read</button><button class="g" data-a="nd" data-i="${n.id}">Delete</button></div>`).join('')||'<p class="mut">No notifications.</p>'}`},
auth(){return`${disc}<div class="grid"><form class="card" data-f="login"><h3>Sign In</h3><input name="n" placeholder="Username" required><input name="p" type="password" placeholder="Password" required><button>Sign In</button><p class="mut">Demo admin: admin / admin123</p></form><form class="card" data-f="reg"><h3>Create Free Account</h3><input name="n" placeholder="Username" required minlength="3"><input name="p" type="password" placeholder="Password" required minlength="4"><button>Register</button><p class="mut">Demo only, not secure. Never use a real password.</p></form></div>`},
admin(){if(!isA())return'<div class="card">Admin access only. Sign in with the demo admin account.</div>';return`<h2>Admin Dashboard</h2><div class="grid">${[['Fans',S.users.length],['Jeo posts',S.posts.filter(p=>p.tab==='Jeo').length],['Gehlee posts',S.posts.filter(p=>p.tab==='Gehlee').length],['JeoLee posts',S.posts.filter(p=>p.tab==='JeoLee').length],['Polls',S.polls.length],['Gallery',S.gal.length],['Pending reports',S.rep.filter(r=>!r.res).length]].map(s=>`<div class="card"><h3>${s[1]}</h3>${s[0]}</div>`).join('')}</div>
<h3>Users</h3>${S.users.map(u=>`<div class="card">${esc(u.name)} ${u.ban?'(suspended)':''} ${u.role==='admin'?'':`<button class="g" data-a="ban" data-i="${u.id}">${u.ban?'Restore':'Suspend'}</button>`}</div>`).join('')}
<h3>Reports</h3>${S.rep.map(r=>`<div class="card">${r.k}: ${esc(r.txt)} ${r.res?'(resolved)':`<button class="r" data-a="rrm" data-i="${r.id}">Remove content</button><button class="g" data-a="rdm" data-i="${r.id}">Dismiss</button>`}</div>`).join('')||'<p class="mut">None.</p>'}
<h3>Gallery review</h3>${S.gal.filter(g=>!g.ok).map(g=>`<div class="card">${esc(g.t)} <button data-a="gok" data-i="${g.id}">Approve</button><button class="r" data-a="gno" data-i="${g.id}">Reject</button></div>`).join('')||'<p class="mut">Nothing pending.</p>'}
<h3>Add JeoLee moment</h3><form class="card" data-f="amoment"><input name="t" placeholder="Title" required><select name="cat">${['Kilig Moments','Funny Interactions','Heartfelt Conversations','Teamwork','Screen Test Moments','Memorable Challenges','Fan-Favorite Scenes','Behind-the-Scenes Content'].map(c=>`<option>${c}</option>`).join('')}</select><input name="ep" placeholder="Episode/date (verified)"><input name="src" placeholder="Public source" required><textarea name="d" placeholder="Description" required></textarea><button>Add</button></form>
<h3>Add episode</h3><form class="card" data-f="aep"><input name="n" placeholder="Number" required><input name="t" placeholder="Title" required><input name="date" placeholder="Air date"><input name="src" placeholder="Source URL"><textarea name="rc" placeholder="Sourced recap" required></textarea><select name="who"><option value="jeo gehlee jeolee">Jeo+Gehlee+JeoLee</option><option value="jeo">Jeo</option><option value="gehlee">Gehlee</option></select><button>Add</button></form>
<h3>Add trivia question</h3><form class="card" data-f="aq"><input name="q" placeholder="Question" required><input name="o0" placeholder="Option 1" required><input name="o1" placeholder="Option 2" required><input name="o2" placeholder="Option 3" required><input name="o3" placeholder="Option 4" required><select name="a"><option value="0">Correct: 1</option><option value="1">2</option><option value="2">3</option><option value="3">4</option></select><input name="e" placeholder="Explanation" required><button>Add</button></form>
<h3>Biographies (public sources only)</h3><form class="card" data-f="abio"><textarea name="jeo">${esc(S.prof.jeo)}</textarea><textarea name="gehlee">${esc(S.prof.gehlee)}</textarea><button>Save</button></form>
<h3>Activity log</h3>${S.log.slice(0,15).map(l=>`<div class="cm">${esc(l)}</div>`).join('')}<button class="r" data-a="reset">Reset all demo data</button>`},
settings(){return`<h2>Settings</h2>${disc}<div class="card"><button class="g" data-a="col">Toggle sidebar</button></div>`},
more(){return P.about()},
about(){return`<h2>About BAHAYBUZZ</h2><div class="card"><p>BAHAYBUZZ is an independent fan-created platform dedicated to celebrating Pinoy Big Brother housemates, memorable moments, and the fan community.</p><div class="warn">This website is an unofficial fan project. It is not affiliated with Pinoy Big Brother, ABS-CBN, GMA Network, or the featured personalities. JeoLee is a fan-created pairing name, and content on this website represents fan appreciation and community interpretation, not confirmation of a real-life relationship.</div><p class="mut">Content is admin-entered with source references. Do not upload unauthorized or private images. Contributors keep credit for their uploads.</p></div>${disc}`},
search(a){const q=decodeURIComponent(a||'').toLowerCase();if(!q)return'<p class="mut">Type to search.</p>';const h=x=>String(x).toLowerCase().includes(q);return`<h2>Results for "${esc(q)}"</h2>${S.moments.filter(m=>h(m.t+m.d)).map(mc).join('')}${S.eps.filter(e=>h(e.t+e.rc)).map(epc).join('')}${S.posts.filter(p=>h(p.t)).map(pc).join('')}${S.polls.filter(p=>h(p.t)).map(pollc).join('')}${S.gal.filter(g=>g.ok&&h(g.t)).map(galc).join('')}${S.users.filter(u=>h(u.name)).map(u=>`<div class="card">👤 ${esc(u.name)}</div>`).join('')}`}};
function render(){const[,r,a]=(location.hash||'#/home').split('/');const k=P[r]?r:'home';document.body.className=document.body.className.replace(/t-\w+/g,'')+(k==='jeo'?' t-jeo':k==='gehlee'?' t-gehlee':k==='jeolee'?' t-jl':'');
const needs=['saved','history'].includes(k)&&!me();$('#main').innerHTML=needs?P.auth():P[k](a);
$('#sb').innerHTML=NAV.filter(n=>n[0]!=='admin'||isA()).map(n=>`<a href="#/${n[0]}" title="${n[2]}" class="${n[0]===k?'on':''}">${n[1]}<span>${n[2]}</span></a>`).join('')+'<a href="#/settings" title="Settings">⚙️<span>Settings</span></a>';
const un2=S.nt.filter(n=>n.u===S.me&&!n.r).length;$('#na').innerHTML=me()?`<a href="#/notifs" class="btn g" style="background:#fff1">🔔${un2||''}</a> <a href="#/profile" class="btn">${esc(me().name)}</a>`:'<a class="btn g" href="#/auth" style="background:#fff1">Sign In</a> <a class="btn" href="#/auth">Join</a>'}
const go=()=>{render();document.body.classList.remove('open')};
addEventListener('hashchange',()=>{tab=location.hash.startsWith('#/community')||location.hash.startsWith('#/jeolee')?tab:'Overview';sq='';go()});
const rf=(a,k)=>{S[a]=S[a];sv();render()};
const item=(l,i)=>S[l].find(x=>x.id===i);
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,i=el.dataset.i;let x;
if(a==='menu')return document.body.classList.toggle('open');if(a==='col')return document.body.classList.toggle('col');
if(a==='tab'){tab=i;return render()}if(a==='room'){room=i;return render()}
if(a==='out'){S.me=null;sv();location.hash='#/home';return go()}
if(a==='reset'){if(confirm('Reset all demo data?')){localStorage.removeItem(K);S=seed();location.hash='#/home';go()}return}
if(a==='gv'){const g=item('gal',i);const d=document.createElement('div');d.style.cssText='position:fixed;inset:0;background:#000e;display:grid;place-items:center;z-index:60';d.innerHTML=`<img src="${g.img}" style="max-width:95%;max-height:95%">`;d.onclick=()=>d.remove();return document.body.appendChild(d)}
if(a==='sh'){navigator.clipboard&&navigator.clipboard.writeText(location.href);return toast('Link copied')}
if(a==='nall'){S.nt.filter(n=>n.u===S.me).forEach(n=>n.r=1)}else if(a==='nr'){item('nt',i).r=1}else if(a==='nd'){S.nt=S.nt.filter(n=>n.id!==i)}
else if(!need())return;
else if(a==='ml'||a==='ms'||a==='mr'||a==='mcm'){x=item('moments',i);if(a==='ml'){tog(x.likes,S.me)}if(a==='ms')tog(x.saves,S.me);if(a==='mr')x.rx[el.dataset.e]=(x.rx[el.dataset.e]||0)+1;if(a==='mcm'){const t=prompt('Your comment');if(!t||bad.test(t))return;x.cm.push({u:S.me,t:t.slice(0,200)})}}
else if(['pl','ps','pcm','pe','pd'].includes(a)){x=item('posts',i);if(a==='pl'){tog(x.likes,S.me);if(x.likes.includes(S.me))note(x.u,un(S.me)+' liked your post')}if(a==='ps')tog(x.saves,S.me);if(a==='pcm'){const t=prompt('Your comment');if(!t||bad.test(t))return;x.cm.push({u:S.me,t:t.slice(0,200)});note(x.u,un(S.me)+' commented on your post')}if(a==='pe'){const t=prompt('Edit post',x.t);if(t&&!bad.test(t))x.t=t.slice(0,500)}if(a==='pd'&&confirm('Delete this post?'))S.posts=S.posts.filter(p=>p.id!==i)}
else if(a==='rep'||a==='grep'){const t=a==='rep'?item('posts',i).t:item('gal',i).t;S.rep.push({id:uid(),k:a==='rep'?'post':'gal',ref:i,by:S.me,txt:t.slice(0,80),res:0});toast('Reported to moderators')}
else if(a==='pv'){const p=item('polls',i);if(p.closed||p.opts.some(o=>o.v.includes(S.me)))return toast('Already voted');p.opts.find(o=>o.id===el.dataset.o).v.push(S.me)}
else if(a==='pcl'){const p=item('polls',i);p.closed=1;note(p.by,'Your poll closed: '+p.t);logA('Closed poll '+p.t)}
else if(a==='es'){tog(item('eps',i).saves,S.me)}else if(a==='ew'){tog(item('eps',i).watched,S.me)}else if(a==='en'){const t=prompt('Private note');if(t!==null)item('eps',i).notes[S.me]=t.slice(0,300)}
else if(a==='gl'){x=item('gal',i);tog(x.likes,S.me);if(x.likes.includes(S.me))note(x.u,un(S.me)+' liked your fan art')}
else if(a==='ban'){x=item('users',i);x.ban=!x.ban;logA('Toggled suspend '+x.name)}
else if(a==='gok'){x=item('gal',i);x.ok=1;note(x.u,'Your image was approved')}else if(a==='gno'){S.gal=S.gal.filter(g=>g.id!==i);toast('Rejected')}
else if(a==='rrm'||a==='rdm'){x=item('rep',i);x.res=1;if(a==='rrm'){S.posts=S.posts.filter(p=>p.id!==x.ref);S.gal=S.gal.filter(g=>g.id!==x.ref);logA('Removed reported content')}}
sv();render()});
document.addEventListener('change',e=>{if(e.target.dataset.up){const f=e.target.files[0];if(!f)return;if(f.size>600000){e.target.value='';return toast('Image too large (max 600KB)')}const r=new FileReader();r.onload=()=>{pend=r.result;toast('Image ready')};r.readAsDataURL(f)}});
document.addEventListener('input',e=>{if(e.target.dataset.s==='ep'){sq=e.target.value.toLowerCase();const p=e.target.selectionStart;render();const n=$('[data-s="ep"]');n.focus();n.setSelectionRange(p,p)}});
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter')location.hash='#/search/'+encodeURIComponent(e.target.value)});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target.dataset.f;if(!f)return;const d=Object.fromEntries(new FormData(e.target));
if(f==='login'){const u=S.users.find(u=>u.name===d.n.trim()&&u.pw===d.p);if(!u)return toast('Wrong username or password');if(u.ban)return toast('Account suspended');S.me=u.id;sv();toast('Welcome '+u.name);location.hash='#/home';return go()}
if(f==='reg'){const n=d.n.trim();if(S.users.some(u=>u.name.toLowerCase()===n.toLowerCase()))return toast('Username taken');if(bad.test(n))return toast('Invalid username');const u={id:uid(),name:n,pw:d.p,role:'fan',bio:'',joined:today(),ban:0,fav:'JeoLee'};S.users.push(u);S.me=u.id;sv();toast('Account created');location.hash='#/home';return go()}
if(!need())return;
if(f==='post'){if(!d.t.trim())return toast('Write something');if(bad.test(d.t)){S.rep.push({id:uid(),k:'auto',ref:'',by:S.me,txt:'Blocked: '+d.t.slice(0,60),res:0});return toast('Post blocked by moderation')}if(Date.now()-lastPost<5000)return toast('Slow down a little');lastPost=Date.now();S.posts.unshift({id:uid(),u:S.me,t:d.t.trim().slice(0,500),tab:d.tab,likes:[],saves:[],cm:[],img:pend,d:today()});pend='';toast('Posted')}
if(f==='poll'){const o=d.o.split('\n').map(s=>s.trim()).filter(Boolean);if(o.length<2)return toast('Need at least 2 options');S.polls.unshift({id:uid(),t:d.t,d:d.d,cat:d.cat,by:S.me,closed:0,date:today(),opts:o.map(t=>({id:uid(),t,v:[]}))})}
if(f==='gal'){if(!pend)return toast('Choose an image first');S.gal.push({id:uid(),t:d.t,u:S.me,cat:d.cat,img:pend,likes:[],date:today(),ok:isA()?1:0});pend='';toast(isA()?'Added':'Submitted for approval')}
if(f==='msg'){(S.msgs[room]=S.msgs[room]||[]).push({u:S.me,t:d.t.slice(0,200)})}
if(f==='prof'){const u=me();u.bio=d.bio.slice(0,200);u.fav=d.fav;toast('Profile saved')}
if(f==='quiz'){let s=0;const ex=S.qs.map((q,i)=>{const ok=Number(d['q'+i])===q.a&&d['q'+i]!==undefined;if(ok)s++;return(ok?'✓ ':'✗ ')+esc(q.q)+' Answer: '+esc(q.o[q.a])+'. '+esc(q.e)});qres={s,n:S.qs.length,ex};S.qr.push({u:S.me,s,n:S.qs.length,d:today()})}
if(isA()){if(f==='amoment'){S.moments.unshift({id:uid(),t:d.t,cat:d.cat,ep:d.ep,d:d.d,src:d.src,likes:[],saves:[],cm:[],rx:{},tags:['jeolee']});logA('Added moment '+d.t)}
if(f==='aep'){S.eps.unshift({id:uid(),n:d.n,t:d.t,date:d.date,rc:d.rc,who:d.who,src:d.src,saves:[],watched:[],notes:{}});logA('Added episode '+d.n)}
if(f==='aq'){S.qs.push({id:uid(),c:'Community Trivia',q:d.q,o:[d.o0,d.o1,d.o2,d.o3],a:Number(d.a),e:d.e})}
if(f==='abio'){S.prof.jeo=d.jeo;S.prof.gehlee=d.gehlee;toast('Saved')}}
sv();render()});
if(!location.hash)location.hash='#/home';go();
</script></body></html>
